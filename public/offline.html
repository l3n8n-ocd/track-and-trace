<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Track-and-Trace</title>
    <style>
      body { font-family: "DM Sans", system-ui, sans-serif; background: #f5f5ed; color: #1f1718; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; padding: 16px; }
      .card { background: #fcfcf8; border: 1px solid #e2dfd3; border-radius: 20px; padding: 32px; max-width: 360px; text-align: center; }
      .logo { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #4a3f40; font-size: 14px; line-height: 1.55; margin: 0; }
      button { margin-top: 20px; background: #8c001b; color: #f5f5ed; border: 0; border-radius: 10px; padding: 11px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
      button:hover { background: #670001; }
      button:focus-visible { outline: 2px solid #ff9002; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Track-and-Trace needs an internet connection. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
