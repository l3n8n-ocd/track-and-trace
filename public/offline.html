<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Track-and-Trace</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; padding: 16px; }
      .card { background: #fff; border-radius: 12px; padding: 32px; max-width: 360px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
      .logo { width: 48px; height: 48px; border-radius: 10px; background: #b91c1c; color: #fff; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
      button { margin-top: 16px; background: #b91c1c; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">RD</div>
      <h1 style="font-size:20px">You're offline</h1>
      <p style="color:#475569;font-size:14px">Track-and-Trace needs an internet connection. Check your connection and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
