<script>
// Prioritize the large display font on the home hero. Other pages discover it
// through CSS, leaving bandwidth available for their route code and body font.
if (window.location.pathname === "/") {
  const font = document.createElement("link");
  Object.assign(font, {rel:"preload", href:"/fonts/archivo-ui.woff2", as:"font", type:"font/woff2", crossOrigin:"anonymous"});
  document.head.appendChild(font);
}
</script>
<title>Track-and-Trace</title>
